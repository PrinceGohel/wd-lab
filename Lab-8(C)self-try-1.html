<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab-8 Part - C Self Try</title>
    <style>
        body {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        text-align: center;
        height: 90vh;
      }
      .container {
        height: 600px;
        width: 600px;
      }
      section {
        display: flex;
        align-items: center;
        justify-content: center;
        color: black;
      }
      header {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: red;
        margin-bottom: 5px;
        height: 20%;
      }
      nav {
        display: flex;
        background-color: white;
        width: 20%;
      }
      .nav-bar{
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: darkblue;
        width: 100%;
        margin-right: 5px;
      }
      main {
        display: flex;
        justify-content: space-between;
        background-color: yellow;
        height: 60%;
      }
      aside {
        background-color: white;
        width: 20%;
        height: 75%;
      }
      .sidebar {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: green;
        margin-bottom: 5px;
        margin-left: 5px;
        height: 98%;
      }
      footer {
        display: flex;
        justify-content: center; 
        align-items: center;
        background-color: skyblue;
        height: 20%;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <main>
        <nav><div class="nav-bar">Navigation</div></nav>
        <section>Containt</section>
        <aside>
          <div class="sidebar">Sidebar</div>
        </aside>
      </main>
      <footer>Footer</footer>
    </div>
  </body>
</html>
