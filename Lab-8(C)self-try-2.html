<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 90vh;
            font-weight: bold;
            color: white;
        }
        .container{
            height: 600px;
            width: 600px;
        }
        header{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: red;
            height: 100px;
        }
        main{
            display: flex;
            justify-content: space-between;
            background-color: yellow;
            height: 300px;
        }
        section{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60%;
            text-align: center;
            color: black;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20%;
            text-align: center;
            border-right: 5px solid white;
            border-bottom: 5px solid white;
            border-top: 5px solid white;
            background-color: darkblue;
        }
        aside{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20%;
            height: 70%;
            text-align: center;
            border-left: 5px solid white;
            border-bottom: 5px solid white;
            border-top: 5px solid white;
            background-color: green;
        }
        footer{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: skyblue;
            height: 100px;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
      <header>Header</header>
      <main>
        <nav>Navigation</nav>
        <section>Containt</section>
        <aside>Sidebar</aside>
      </main>
      <footer>Footer</footer>
    </div>
</body>
</html>
