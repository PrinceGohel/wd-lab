<!DOCTYPE html>
<html>

<head>
    <title>hello !!</title>
</head>

<body>
    <h1 align="center">Student registration</h1>
    <table align="center" cellpadding="5">
        <form action="">
            <tr>
                <td><label for="">Full Name : </label></td>
                <td><input type="text" placeholder="Enter Your Name"></td>
            </tr>
            <tr>
                <td><label for="">Email : </label></td>
                <td><input type="email" placeholder="Enter Your Email"></td>
            </tr>
            <tr>
                <td><label for="">Mobile Number : </label></td>
                <td><input type="tel" placeholder="Enter Mobile Number"></td>
            </tr>
            <tr>
                <td><label for="">Address</label></td>
                <td><textarea name="" id="" placeholder="Enter Your Addres" rows="4"></textarea></td>
            </tr>
            <tr>
                <td><label for="">nationality : </label></td>
                <td><input type="text" placeholder="Enter Your Nationality"></td>
            </tr>
            <tr>
                <td><label for="">Date of birth : </label></td>
                <td><input type="date"><br></td>
            </tr>
            <tr>
                <td><label for="">Gender : </label></td>
                <td><label for="">Male</label>
                    <input type="radio" name="gender">
                    <label for="">Female</label>
                    <input type="radio" name="gender">
                </td>
            </tr>
            <tr>
                <td><label for="">Highest degree : </label></td>
                <td>
                    <select name="" id="">
                        <option name="" id="" disabled selected>select a Degree</option>
                        <option value="">B.A</option>
                        <option value="">M.A.</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">CPI :</label></td>
                <td><input type="text" placeholder="Enter Your CPI"></td>
            </tr>
            <tr>
                <td><label for="">University :</label></td>
                <td><input type="text" placeholder="Enter Your University"></td>
            </tr>
            <tr>
                <td><label for="">Passing year : </label></td>
                <td><select name="" id="">
                    <option value="">2026</option>
                    <option value="">2025</option>
                </select></td>
            </tr>
            <tr>
                <td><input type="submit"></td>
                <td><input type="reset" value="cancel"></td>
            </tr>
        </form>
    </table>
</body>

</html>
