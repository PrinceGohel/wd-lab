<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <h1 align="center">create account</h1>
    <form>
      <table border="0" align="center" cellspacing="20">
        <tr>
            <td colspan="2"><hr></td>
        </tr>
        <tr>
          <td>
            <label for="fname">First name* </label><br />
            <input type="text" name="fname" id="fname" />
          </td>
          <td>
            <label for="">Last name</label><br />
            <input type="text" name="" id="" />
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <label for="">Email*</label><br />
            <input type="email" name="" id="" size="60" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">password*</label><br />
            <input type="password" name="" id="" />
          </td>
          <td>
            <label for="">confirm password</label><br />
            <input type="password" name="" id="" /><br />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Gender</label><br />
            <label for="">Male</label>
            <input type="radio" name="gender" />
            <label for="">Female</label>
            <input type="radio" name="gender" />
          </td>
          <td>
            <label for="">Hobbies</label><br />
            <label for="">Music</label>
            <input type="checkbox" name="gender" />
            <label for="">Sports</label>
            <input type="checkbox" name="gender" />
            <label for="">Travel</label>
            <input type="checkbox" name="gender" />
            <label for="">Movies</label>
            <input type="checkbox" name="gender" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="income">Source income</label><br />
            <select name="" id="">
              <option value="" disabled selected>Source of income</option>
              <option value="">employed</option>
              <option value="">bussess</option>
            </select>
          </td>
          <td>
            <label for="income">income</label><br />
            <input
              type="range"
              id="income"
              name="income"
              min="0"
              max="20000"
              value="5000"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Uploaed profile picture</label><br />
            <input type="file" name="" id="" />
          </td>
          <td>
            <label for="">Age</label>
            <input type="number" id="Age" name="Age" />
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <label for="">Bio</label>
            <textarea name="" id="" rows="4" cols="60"></textarea>
          </td>
        </tr>
     <tr>
        <td colspan="2"><hr></td>
     </tr>
        <tr align="right">
          <td colspan="2" >
            <input type="submit" value="create"/>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
