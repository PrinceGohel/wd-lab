<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <table cellspacing="10px" cellpadding="20" align="center" border="1">
        <tr>
            <th colspan="3" style="background-color: red; color: white;" width="500">Header</th>
        </tr>
        <tr>
            <th style="background-color: rgb(23, 38, 151); color: white;" height="150" width="75" rowspan="2" width="20%">navigation</th>   
            <th style="background-color: yellow; color: white;" width="55%">content</th>
            <th style="background-color: green; color: white;" width="25%" >sidebar</th>
        </tr>
        <tr>
            <th colspan="2" ></th>
        </tr>
        <tr>
            <th colspan="3" style="background-color: skyblue; color: white;"  height="80">footer</th>
        </tr>
    </table>
    <table border="1" width="100%">
    <!-- Header -->
    <tr>
        <td colspan="3" height="80">
            Header
        </td>
    </tr>

    <!-- Main upper section -->
    <tr>
        <td rowspan="2" width="20%">
            Navigation
        </td>

        <td width="55%" rowspan="2">
            Content
        </td>

        <td width="25%">
            Sidebar
        </td>
    </tr>

    <!-- Lower content -->
    <tr>
        <td colspan="2" rowspan="1">
            Content
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td colspan="3" height="80">
            Footer
        </td>
    </tr>
</table>
</body>
</html>
